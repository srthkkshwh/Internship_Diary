<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cubicle.wtf — one desk, every hour of the internship</title>
<meta name="description" content="One cubicle. One laptop stuck between a process simulation and a phone full of reels. The light, the playlist and the will to live change by the hour.">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg-1:#12141c;
  --bg-2:#e8e6df;
  --green:#1c7a4d;
  --screen:#6fb1ff;
  --amber:#f0a868;
  --ink:#20222b;
  --ink-light:#f4f2ec;

  --bg: var(--bg-1);
  --fg: var(--ink-light);
  --fg-dim: rgba(244,242,236,0.62);
  --accent: var(--screen);
  --lamp-opacity: 0;
  --transition: 900ms cubic-bezier(.4,0,.2,1);
}

*{box-sizing:border-box; margin:0; padding:0;}

html,body{height:100%;}

body{
  font-family:'Inter', sans-serif;
  background: var(--bg); /* fallback while the image loads */
  color: var(--fg);
  transition: color var(--transition);
  min-height:100vh;
  overflow-x:hidden;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

.wrap{
  max-width: 1100px;
  margin: 0 auto;
  padding: 2.5rem 1.5rem 3rem;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* top bar */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-family:'IBM Plex Mono', monospace;
  font-size:0.85rem;
  letter-spacing:0.02em;
  color: var(--fg-dim);
  margin-bottom: 3rem;
}
.topbar .logo{
  color: var(--fg);
  font-weight:600;
  font-size:0.95rem;
}
.topbar .logo span{ color: var(--accent); transition: color var(--transition); }

/* hero */

.clock{
  font-family:'IBM Plex Mono', monospace;
  font-size: 1rem;
  color: var(--accent);
  transition: color var(--transition);
  margin-bottom: 0.6rem;
}

.eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.7rem;
  text-transform:uppercase;
  letter-spacing:0.12em;
  color: var(--fg-dim);
  margin-bottom: 0.8rem;
}

h1{
  font-family:'IBM Plex Mono', monospace;
  font-weight:600;
  font-size: clamp(1.4rem, 3vw, 2rem);
  line-height:1.1;
  margin-bottom: 0.9rem;
  transition: color var(--transition);
}

.desc{
  font-size: 0.9rem;
  line-height:1.55;
  color: var(--fg-dim);
  max-width: 40ch;
  margin: 0 auto 1.3rem;
  transition: color var(--transition);
}

@keyframes pulse{
  0%,100%{ opacity:1; }
  50%{ opacity:0.35; }
}

/* full-bleed background photo, fixed behind everything */
.hero-bg{
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
}
.hero-bg img{
  width:100%;
  height:100%;
  object-fit: cover;
  object-position: center 62%;
  display:block;
}
.hero-bg-scrim{
  position:absolute;
  inset:0;
  background: linear-gradient(180deg,
    rgba(8,9,14,0.30) 0%,
    rgba(8,9,14,0.10) 30%,
    rgba(8,9,14,0.20) 55%,
    rgba(8,9,14,0.78) 100%);
  pointer-events:none;
}
.hero-bg-tint{
  position:absolute;
  inset:0;
  background: var(--accent);
  opacity: 0.10;
  mix-blend-mode: multiply;
  transition: background var(--transition);
  pointer-events:none;
}

/* hero (now single column, floating over the background photo) */
.hero{
  display:flex;
  justify-content:center;
  margin-top: 34vh;
}
.hero-copy{
  max-width: 560px;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.hero-copy h1, .hero-copy .desc, .hero-copy .eyebrow{
  text-shadow: 0 2px 10px rgba(0,0,0,0.85), 0 1px 3px rgba(0,0,0,0.9);
}
.hero-copy .player{ align-items:center; }
@media (max-width: 700px){
  .hero{ margin-top: 26vh; }
}

/* embedded player */
.player{
  display:flex;
  flex-direction:column;
  gap: 0.6rem;
  max-width: 260px;
}
.player-cover{
  position:relative;
  width:100%;
  aspect-ratio: 16/9;
  border-radius: 10px;
  overflow:hidden;
  background: #0d0f16;
  border: 1px solid rgba(244,242,236,0.14);
}
.player-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
/* the real YouTube iframe lives here, kept invisible — it's the audio
   engine, the cover image above it is what's actually seen */
#yt-audio-mount{
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
}

.player-label{
  display:inline-flex;
  align-items:center;
  gap:0.6rem;
  font-family:'IBM Plex Mono', monospace;
  font-size:0.85rem;
  color: var(--fg);
}
.player-label .dot{
  width:7px; height:7px; border-radius:50%;
  background: var(--accent);
  transition: background var(--transition);
  animation: pulse 1.8s ease-in-out infinite;
}
.player-label .dot.paused{ animation: none; opacity: 0.4; }

/* pill-shaped play/pause + next controls */
.controls-pill{
  display:inline-flex;
  align-items:center;
  gap: 0.35rem;
  width: fit-content;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(244,242,236,0.14);
  border-radius: 999px;
  padding: 0.35rem;
}
.pill-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  width: 36px;
  height: 36px;
  border-radius:50%;
  border:none;
  background: transparent;
  color: var(--fg);
  cursor:pointer;
  transition: background 200ms, color var(--transition);
}
.pill-btn:hover{ background: rgba(255,255,255,0.12); }
#radio-btn{
  width: 28px;
  height: 28px;
  color: var(--fg-dim);
}
#radio-btn.active{
  background: var(--accent);
  color: var(--ink);
}
#radio-btn.active:hover{ background: var(--accent); filter: brightness(1.08); }
#play-pause-btn{
  background: var(--accent);
  color: var(--ink);
}
#play-pause-btn:hover{ filter: brightness(1.08); background: var(--accent); }
#play-pause-btn svg{ margin-left: 1px; }
.pill-divider{
  width: 1px;
  height: 20px;
  background: rgba(244,242,236,0.18);
}

.yt-music-link{
  display:none;
  font-family:'IBM Plex Mono', monospace;
  font-size:0.78rem;
  color: var(--fg-dim);
  text-decoration:none;
  border-bottom: 1px solid transparent;
  width: fit-content;
  transition: color 200ms, border-color 200ms;
}
.yt-music-link.show{ display:inline-block; }
.yt-music-link:hover{ color: var(--fg); border-color: currentColor; }

/* timeline */
.timeline{
  margin-top: 3rem;
  display:flex;
  justify-content:center;
  gap: 0.4rem;
  overflow-x:auto;
  padding-bottom: 0.5rem;
  scrollbar-width: thin;
}
.tl-item{
  flex: 0 0 auto;
  font-family:'IBM Plex Mono', monospace;
  font-size: 0.78rem;
  color: var(--fg-dim);
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  padding: 0.55rem 0.85rem;
  border-radius: 8px;
  cursor:pointer;
  transition: background 200ms, color 200ms, border-color 200ms;
  white-space:nowrap;
}
.tl-item:hover{
  border-color: rgba(255,255,255,0.25);
  color: var(--fg);
}
.tl-item.active{
  background: var(--accent);
  color: var(--ink);
  border-color: transparent;
  font-weight:600;
}
.tl-item .now-tag{
  font-size:0.68rem;
  opacity:0.75;
  margin-left:0.3rem;
}
.tl-item:focus-visible, .pill-btn:focus-visible{
  outline: 2px solid var(--fg);
  outline-offset: 2px;
}

footer{
  margin-top: 2.5rem;
  font-family:'IBM Plex Mono', monospace;
  font-size: 0.75rem;
  color: var(--fg-dim);
  text-align:center;
}
footer a{ color: inherit; }
</style>
</head>

// Fisher–Yates shuffle, done in place.
function shuffleArray(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Randomize the order once on page load, so it's not the same sequence
// every visit.
shuffleArray(playlist);

function slotDecimalHour(s){
  return s.hour + (s.minute || 0) / 60;
}

function getSlotIndexForHour(decimalHour){
  // Slots only cover the real workday, 9:00 to 6:00. Outside that window
  // (evenings, weekends, whatever) just default to the start of the day.
  for(let i = slots.length - 1; i >= 0; i--){
    if(decimalHour >= slotDecimalHour(slots[i])) return i;
  }
  return 0;
}

const root = document.documentElement;
const clockEl = document.getElementById('clock');
const rangeEl = document.getElementById('slot-range');
const titleEl = document.getElementById('slot-title');
const descEl = document.getElementById('slot-desc');
const songEl = document.getElementById('slot-song');
const timelineEl = document.getElementById('timeline');
const playerThumb = document.getElementById('player-thumb');
const radioBtn = document.getElementById('radio-btn');
const playPauseBtn = document.getElementById('play-pause-btn');
const nextBtn = document.getElementById('next-btn');
const playerDot = document.getElementById('player-dot');
const ytLink = document.getElementById('yt-music-link');

const PLAY_ICON = '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
const PAUSE_ICON = '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>';

let currentIdx = null;       // which slot (visual mood) is showing
let currentSongIdx = 0;      // which song in the playlist is loaded
let isPlaying = false;
let ytPlayer = null;
let playerReady = false;
let pendingPlay = false;     // true if the user clicked Play before the player finished loading
let isRadioMode = false;     // true while the radio button is toggled on
const nowDate = new Date();
const nowDecimalHour = nowDate.getHours() + nowDate.getMinutes() / 60;
const realNowIdx = getSlotIndexForHour(nowDecimalHour);

function thumbUrl(videoId){
  return 'https://img.youtube.com/vi/' + videoId + '/hqdefault.jpg';
}

function setPlaying(state){
  isPlaying = state;
  playPauseBtn.innerHTML = state ? PAUSE_ICON : PLAY_ICON;
  playPauseBtn.setAttribute('aria-label', state ? 'Pause' : 'Play');
  playerDot.classList.toggle('paused', !state);
}

// Fetches a song's real title straight from YouTube (works once this page
// is hosted somewhere real, e.g. GitHub Pages — it won't work over a plain
// file:// link since browsers block that kind of cross-origin request from
// local files). Results are cached on the playlist entry itself so each
// song is only looked up once, no matter how many times it comes back
// around in the loop.
function fetchSongTitle(videoId){
  const url = 'https://www.youtube.com/oembed?format=json&url=' +
    encodeURIComponent('https://www.youtube.com/watch?v=' + videoId);
  return fetch(url)
    .then(function(res){ if(!res.ok) throw new Error('oEmbed failed'); return res.json(); })
    .then(function(data){ return data.title; })
    .catch(function(){ return null; }); // keep whatever fallback title was already showing
}

let songUpdateToken = 0;

function updateSongUI(){
  const song = playlist[currentSongIdx];
  const myToken = ++songUpdateToken;

  playerThumb.src = thumbUrl(song.videoId);
  playerThumb.alt = (song.title || 'Song') + ' — song artwork';
  songEl.textContent = 'Now playing: ' + (song.title || 'this track');

  fetchSongTitle(song.videoId).then(function(realTitle){
    if(!realTitle) return;
    song.title = realTitle; // cache on the playlist entry, don't refetch next time
    // Only touch the UI if this is still the song actually showing —
    // avoids an old lookup overwriting a newer one if songs changed fast.
    if(myToken === songUpdateToken){
      songEl.textContent = 'Now playing: ' + realTitle;
      playerThumb.alt = realTitle + ' — song artwork';
    }
  });
}

// The YouTube script calls this itself once it finishes loading — we kick
// off that load immediately on page load (see bottom of this script), well
// before the user presses play, so the player is already sitting there
// ready to go by the time they click.
window.onYouTubeIframeAPIReady = function(){
  const song = playlist[currentSongIdx];
  ytPlayer = new YT.Player('yt-audio-mount', {
    videoId: song.videoId,
    playerVars: { autoplay: 0, controls: 0, disablekb: 1, modestbranding: 1, rel: 0 },
    events: {
      onReady: function(e){
        playerReady = true;
        const frame = e.target.getIframe();
        frame.style.width = '100%';
        frame.style.height = '100%';
        // If the user already mashed Play while this was still loading,
        // honor it now.
        if(pendingPlay){
          pendingPlay = false;
          e.target.playVideo();
          setPlaying(true);
        }
      },
      onStateChange: function(e){
        if(e.data === YT.PlayerState.PLAYING) syncNowPlayingFromPlayer();
        if(e.data === YT.PlayerState.ENDED) goNext();
      }
    }
  });
};

// Reads whatever's actually loaded in the player right now and reflects it
// in the UI. This is the source of truth once we're in radio mode, since
// we don't know ahead of time which song YouTube's mix will pick next.
function syncNowPlayingFromPlayer(){
  if(!ytPlayer || typeof ytPlayer.getVideoData !== 'function') return;
  const data = ytPlayer.getVideoData();
  if(!data || !data.title) return;

  playerThumb.src = thumbUrl(data.video_id);
  playerThumb.alt = data.title + ' — song artwork';
  songEl.textContent = (isRadioMode ? '🔀 ' : '') + 'Now playing: ' + data.title;

  // If this happens to be a curated song, cache the real title back onto
  // it so the pre-play label is accurate next time it comes up.
  if(!isRadioMode && playlist[currentSongIdx] && playlist[currentSongIdx].videoId === data.video_id){
    playlist[currentSongIdx].title = data.title;
  }
}

function togglePlayPause(){
  if(!playerReady){
    // Player's still loading — remember the click and honor it in onReady.
    pendingPlay = !pendingPlay;
    setPlaying(pendingPlay);
    return;
  }
  if(isPlaying){ ytPlayer.pauseVideo(); setPlaying(false); }
  else { ytPlayer.playVideo(); setPlaying(true); }
}

// Turns radio mode on, seeded off whatever song is actually playing right
// now (curated or already-radio) — not tied to any fixed song.
function startRadio(){
  let seedId = playlist[currentSongIdx].videoId;
  if(playerReady && typeof ytPlayer.getVideoData === 'function'){
    const data = ytPlayer.getVideoData();
    if(data && data.video_id) seedId = data.video_id;
  }

  isRadioMode = true;
  radioBtn.classList.add('active');
  radioBtn.setAttribute('aria-label', 'Stop radio, back to playlist');
  songEl.textContent = '🔀 Starting radio…';
  if(playerReady){
    ytPlayer.loadPlaylist({ list: 'RD' + seedId, listType: 'playlist', index: 0 });
    setPlaying(true);
  }
}

// Turns radio off and drops back into the curated list right where it was
// left (currentSongIdx is untouched while radio mode runs).
function stopRadio(){
  isRadioMode = false;
  radioBtn.classList.remove('active');
  radioBtn.setAttribute('aria-label', 'Start radio from this song');
  updateSongUI();
  if(playerReady && isPlaying){
    ytPlayer.loadVideoById(playlist[currentSongIdx].videoId);
  }
}

// Toggled by the radio button.
function toggleRadioMode(){
  if(isRadioMode){ stopRadio(); } else { startRadio(); }
}

function goNext(){
  if(isRadioMode){
    // Already in the endless mix — just tell YouTube to advance its own
    // internal queue, no bookkeeping needed on our end.
    if(playerReady) ytPlayer.nextVideo();
    return;
  }
  if(currentSongIdx + 1 < playlist.length){
    currentSongIdx++;
    updateSongUI();
    if(playerReady && isPlaying){
      ytPlayer.loadVideoById(playlist[currentSongIdx].videoId);
    }
    return;
  }
  // That was the last curated song — hand off to radio automatically
  // instead of looping back to the start.
  shuffleArray(playlist); // fresh order queued up for whenever radio gets turned off
  currentSongIdx = 0;
  startRadio();
}

function applySlot(idx){
  const s = slots[idx];
  currentIdx = idx;

  root.style.setProperty('--bg', s.bg);
  root.style.setProperty('--accent', s.accent);

  clockEl.textContent = s.clock;
  rangeEl.textContent = s.range;
  titleEl.textContent = s.title;
  descEl.textContent = s.desc;

  document.querySelectorAll('.tl-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });
}

radioBtn.addEventListener('click', toggleRadioMode);
playPauseBtn.addEventListener('click', togglePlayPause);
nextBtn.addEventListener('click', goNext);

if(playlistYtMusicUrl){
  ytLink.href = playlistYtMusicUrl;
  ytLink.textContent = 'Open playlist in YouTube Music →';
  ytLink.classList.add('show');
}

slots.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = 'tl-item';
  btn.type = 'button';
  btn.innerHTML = s.label + (i === realNowIdx ? '<span class="now-tag">(now)</span>' : '');
  btn.addEventListener('click', () => applySlot(i));
  timelineEl.appendChild(btn);
});

setPlaying(false);
updateSongUI();
applySlot(realNowIdx);

// Start loading the YouTube player right away so it's ready before the
// user even reaches for the play button.
(function loadYouTubeAPI(){
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

</script>
